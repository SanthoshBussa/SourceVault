server:
  port: 8082

spring:
  application:
    name: resource-collection-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

sourcevault:
  collection:
    max-file-size-bytes: 20971520 # 20MB
    max-job-bytes: 104857600 # 100MB
    connect-timeout-ms: 10000
    read-timeout-ms: 15000
    max-concurrent-downloads: 6
    user-agent: "SourceVault-Collector/1.0 (+https://sourcevault.local)"
    storage-dir: "./data/collected-resources"
